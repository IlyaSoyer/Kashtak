                        cx.globalAlpha = Math.min(1, Math.max(0, (H - y) / 200));
                        var line = INTRO_TEXT[i];
                        if (line === "КАШТАК" || line === "ИНОПЛАНЕТЯНЕ." || line === "ПИВО ИСЧЕЗЛО." || line.indexOf("«ХУЙ ВАМ") == 0 || line.indexOf("ЭТО ИСТОРИЯ") == 0) { drawComicText(line, W / 2, y, 36, "#ffcc00", "#000", "center", FONT_TITLE) }
                        else { drawComicText(line, W / 2, y, 28, "#f6c065", "#000", "center", FONT_BODY) }
                    }
                }
                cx.restore();
                introY -= 1.0;
                if ((introY < -(INTRO_TEXT.length * lineH) - 100 || skipIntro) && !introCutscenePlayed) { introCutscenePlayed = true; playCutscene("cutscene_1.mp4", "title") }
                cx.globalAlpha = 1;
                drawComicText("[ Любая клавиша / клик — пропустить ]", W / 2, H - 20, 14, "#fff", "#000", "center")
            }
            else if (gamePhase === "title") {
                playTrack(introMusic); drawBG(0); cx.fillStyle = "rgba(0,0,0,.72)"; cx.fillRect(0, 0, W, H);
                drawComicText("КАШТАК", W / 2, 90, 80, "#f6c065", "#000", "center", FONT_TITLE);
                drawComicText("ПОСЛЕДНЯЯ БАНКА", W / 2, 140, 38, "#fff", "#000", "center", FONT_TITLE);
                for (var m = 0; m < MENU_ITEMS.length; m++) { var my = MENU_Y0 + m * MENU_LH; if (m === menuIdx) { drawComicText("▶ " + MENU_ITEMS[m].label, W / 2, my, 26, "#ffcc00", "#000", "center", FONT_BODY) } else { drawComicText(MENU_ITEMS[m].label, W / 2, my, 24, "#fff", "#000", "center", FONT_BODY) } }
                cx.globalAlpha = 0.5 + 0.5 * Math.sin(frame * 0.08);
                drawComicText(isTouchDevice ? "Тап — выбрать пункт" : "↑ ↓ — выбор · Enter / Пробел / клик — подтвердить", W / 2, H - 20, 14, "#fff", "#000", "center");
                cx.globalAlpha = 1;
                if (showOverlay) { drawOverlayLines(showOverlay === "terms" ? TERMS_LINES : (showOverlay === "privacy" ? PRIVACY_LINES : CONTROL_LINES)) }
            }
            else if (gamePhase === "levelintro") {
                drawBG(0); cx.fillStyle = "rgba(0,0,0,.72)"; cx.fillRect(0, 0, W, H);
                var LI = LEVEL_INTROS[level];
                drawComicText(LI.title, W / 2, 150, 46, "#f6c065", "#000", "center", FONT_TITLE);
                var fs = 21, lh = 30, maxW = W - 120, wrapped = []; cx.font = "bold " + fs + "px " + FONT_BODY;
                for (var li = 0; li < LI.lines.length; li++) { var wl = wrapLines(LI.lines[li], maxW); for (var wi = 0; wi < wl.length; wi++)wrapped.push(wl[wi]) }
                var top = 200, bot = 450, blockH = wrapped.length * lh, sy = top + Math.max(0, (bot - top - blockH) / 2) + lh / 2;
                cx.fillStyle = "#fff"; cx.textAlign = "center"; cx.textBaseline = "middle";
                for (var ri = 0; ri < wrapped.length; ri++)cx.fillText(wrapped[ri], W / 2, sy + ri * lh);
                cx.textBaseline = "alphabetic"; cx.textAlign = "left";
                cx.globalAlpha = 0.5 + 0.5 * Math.sin(frame * 0.09);
                drawComicText(isTouchDevice ? "[ ТАП — НАЧАТЬ ]" : "[ ENTER — НАЧАТЬ ]", W / 2, 485, 22, "#ffcc00", "#000", "center", FONT_BODY);
                cx.globalAlpha = 1
            }
            else if (gamePhase === "dialog") { var dl = (DIALOGS[level] && DIALOGS[level][dialogIdx]) ? DIALOGS[level][dialogIdx] : null; if (dl) dialogChar = Math.min(dl.text.length, dialogChar + 1); drawWorld(); drawDialog(DIALOGS[level], dialogIdx, dialogChar) }
            else if (gamePhase === "afterboss2") { var lines = DIALOGS_AFTER_BOSS2; if (dialogAfterBoss2Idx < lines.length) dialogAfterBoss2Char = Math.min(lines[dialogAfterBoss2Idx].text.length, dialogAfterBoss2Char + 1); drawWorld(); drawDialog(lines, dialogAfterBoss2Idx, dialogAfterBoss2Char) }
            else if (gamePhase === "pause") { drawWorld(); drawPause(); if (showOverlay) drawOverlayLines(CONTROL_LINES) }
            else if (gamePhase === "clear") {
                drawBG(camCur); cx.fillStyle = "rgba(0,0,0,.72)"; cx.fillRect(0, 0, W, H);
                drawComicText("УРОВЕНЬ 1 ПРОЙДЕН!", W / 2, 180, 50, "#f6c065", "#000", "center", FONT_TITLE);
                cx.fillStyle = "#fff"; cx.font = "22px " + FONT_BODY; cx.textAlign = "center";
                cx.fillText("Кабан Кабаныч повержен. Но он был лишь ширмой…", W / 2, 240);
                cx.fillText("За ларьками стояли пришельцы. Впереди — ночной Каштак.", W / 2, 270);
                drawComicText("Кабан Кабаныч: «Я лишь ширма! Говори с Управляющим сам…»", W / 2, 320, 20, "#e74c3c", "#000", "center", FONT_BODY);
                cx.globalAlpha = 0.5 + 0.5 * Math.sin(frame * 0.09);
                drawComicText(isTouchDevice ? "[ ТАП — УРОВЕНЬ 2 ]" : "[ ENTER — УРОВЕНЬ 2 ]", W / 2, 380, 22, "#ffcc00", "#000", "center", FONT_BODY);
                cx.globalAlpha = 1; cx.textAlign = "left"
            }
            else if (gamePhase === "levelsummary") {
                drawBG(camCur); cx.fillStyle = "rgba(0,0,0,.85)"; cx.fillRect(0, 0, W, H);
                drawComicText("УРОВЕНЬ 1 ПРОЙДЕН!", W / 2, 100, 50, "#f6c065", "#000", "center", FONT_TITLE);
                drawComicText("ИТОГИ УРОВНЯ", W / 2, 160, 36, "#fff", "#000", "center", FONT_BODY);
                cx.fillStyle = "#fff"; cx.font = "24px " + FONT_BODY; cx.textAlign = "center";
                cx.fillText("Врагов побеждено: " + enemiesKilled, W / 2, 220);
                cx.fillText("Ящиков разбито: " + cratesDestroyed, W / 2, 260);
                cx.fillText("Очков за уровень: " + levelScore, W / 2, 300);
                cx.fillStyle = "#ffcc00"; cx.font = "bold 32px " + FONT_BODY; cx.fillText("ВСЕГО ОЧКОВ: " + score, W / 2, 360);
                cx.textAlign = "left";
                cx.globalAlpha = 0.5 + 0.5 * Math.sin(frame * 0.08);
                drawComicText(isTouchDevice ? "[ ТАП — СЛЕДУЮЩИЙ УРОВЕНЬ ]" : "[ ENTER — СЛЕДУЮЩИЙ УРОВЕНЬ ]", W / 2, 440, 20, "#ffcc00", "#000", "center", FONT_BODY);
                cx.globalAlpha = 1
            }
            else if (gamePhase === "credits") {
                if (audioUnlocked && musicEnabled && currentTrack !== introMusic) playTrack(introMusic);
                cx.fillStyle = "#000"; cx.fillRect(0, 0, W, H); drawLogoBackground();
                cx.fillStyle = CRED_GRAD; cx.fillRect(0, 0, W, H);
                cx.textAlign = "center";
                for (var ci = 0; ci < CREDITS_LINES.length; ci++) {
                    var cy = creditsY + ci * 30;
                    if (cy > -40 && cy < H + 40) {
                        var line = CREDITS_LINES[ci];
                        if (ci === 0 || line === "КОНЕЦ." || line === "КАШТАК. 2026." || line.indexOf("Автор") == 0 || line.indexOf("БОЙ + ПОГОНЯ") == 0) { drawComicText(line, W / 2, cy, 30, "#f6c065", "#000", "center", FONT_TITLE) }
                        else if (line.indexOf("Один человек.") === 0) { drawComicText(line, W / 2, cy, 26, "#ffcc00", "#000", "center", FONT_TITLE) }
                        else if (line.indexOf("[") === 0) { drawComicText(line, W / 2, cy, 14, "#9d8fb8", "#000", "center") }
                        else if (line.indexOf("donationalerts") === 0) { drawComicText(line, W / 2, cy, 18, "#f6c065", "#000", "center", FONT_BODY) }
                        else { cx.fillStyle = "#fff"; cx.font = "19px " + FONT_BODY; cx.fillText(line, W / 2, cy) }
                    }
                }
                if (!audioUnlocked) { cx.globalAlpha = 0.5 + 0.5 * Math.sin(frame * 0.1); drawComicText("[ НАЖМИ ЛЮБУЮ КЛАВИШУ / КЛИК — ВКЛЮЧИТЬ МУЗЫКУ ]", W / 2, H - 22, 15, "#ffcc00", "#000", "center", FONT_BODY); cx.globalAlpha = 1 }
                else { cx.globalAlpha = 0.4 + 0.3 * Math.sin(frame * 0.06); drawComicText("[ ТИТРЫ ИДУТ ДО КОНЦА · BACKSPACE — В МЕНЮ ]", W / 2, H - 22, 13, "#9d8fb8", "#000", "center"); cx.globalAlpha = 1 }
                cx.textAlign = "left";
                creditsY -= 0.4;
                if (creditsY < -(CREDITS_LINES.length * 30) - 80) gamePhase = "title"
            }
            else if (gamePhase === "lose") {
                stopMusic(); drawBG(camCur);
                cx.fillStyle = "rgba(0,0,0,.66)"; cx.fillRect(0, 140, W, 260);
                drawComicText("ТЕБЯ ОПТИМИЗИРОВАЛИ…", W / 2, 220, 50, "#e74c3c", "#000", "center", FONT_TITLE);
                cx.fillStyle = "#fff"; cx.font = "20px " + FONT_BODY; cx.textAlign = "center";
                cx.fillText("Волна " + Math.max(1, waveIdx) + " из " + CUR_WAVES.length + ". В следующий раз блокируйся и не лезь в толпу.", W / 2, 270);
                cx.globalAlpha = 0.5 + 0.5 * Math.sin(frame * 0.09);
                drawComicText(isTouchDevice ? "[ ТАП — ЕЩЁ РАЗ ]" : "[ ENTER / КЛИК — ЕЩЁ РАЗ ]", W / 2, 380, 20, "#fff", "#000", "center", FONT_BODY);
                cx.globalAlpha = 1;
                drawComicText("Автор и разработчик — Ilya Soyer", W / 2, 420, 16, "#9d8fb8", "#000", "center");
                cx.textAlign = "left";
                if (restartFlag) { restartFlag = false; level = 1; resetLevel(1); gamePhase = "fight"; playTrackForLevel(1) }
            }
            else {
                updatePlayer(); for (var e = 0; e < enemies.length; e++)updateEnemy(enemies[e]); resolveBodies();
                updateItems(); updatePuffs(); updateProjectiles(); updatePoison(); checkWave();
                var target = lock ? zoneMin : Math.max(0, Math.min(WORLD_W - W, P.x - W / 2));
                camCur += (target - camCur) * 0.18;
                if (Math.abs(target - camCur) < 0.5) camCur = target;
                if (shake > 0) shake--;
                cx.save(); if (shake > 0) cx.translate((Math.random() - .5) * 8, (Math.random() - .5) * 8); drawWorld(); cx.restore()
            }
            if (impactFlash > 0) { cx.fillStyle = "rgba(255,255,255," + (impactFlash / 2) + ")"; cx.fillRect(0, 0, W, H); impactFlash-- }
            tickBuf()
        }
        if (RET_WIN) { score = RUNNER_SCORE; level = 2; CREDITS_LINES = ["БОЙ + ПОГОНЯ: ИТОГОВЫЙ СЧЁТ — " + score, ""].concat(CREDITS_LINES); gamePhase = "credits"; creditsY = H; playTrack(introMusic) }
        requestAnimationFrame(loop);
        if ("serviceWorker" in navigator) { addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () { }) }) }
    </script>
</body>
