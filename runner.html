            else if (!G.bossSpawned) { txt("ДО БОССА: " + Math.max(0, Math.round((BOSS_AT - G.dist) / 100)) + "00м", W / 2, 30, 14, C_MUT, "center") }
        }

        function rDrawTitle() {
            drawSky(); drawRainFar(); drawGrass(); drawRoad(); drawRainMid(); drawRainNear(); drawSplash();
            cx.fillStyle = "rgba(0,0,0,.62)"; cx.fillRect(0, 0, W, H);
            panel(MPX, MPY, MPW, MPH);
            var vg = cx.createLinearGradient(0, MPY, 0, MPY + MPH);
            vg.addColorStop(0, "rgba(246,192,101,.10)"); vg.addColorStop(.5, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(231,76,60,.10)");
            cx.fillStyle = vg; cx.fillRect(MPX + 3, MPY + 3, MPW - 6, MPH - 6);
            txt("КАШТАК", W / 2, 112, 60, C_GOLD, "center", "Bangers");
            txt("ПОГОНЯ ЗА БАБЛ-ЛОРДОМ", W / 2, 158, 24, "#fff", "center", "Bangers");
            cx.strokeStyle = "rgba(246,192,101,.5)"; cx.lineWidth = 2;
            cx.beginPath(); cx.moveTo(MPX + 40, 182); cx.lineTo(MPX + MPW - 40, 182); cx.stroke();
            for (var m = 0; m < TITLE_ITEMS.length; m++) { var iy = MI_Y0 + m * MI_LH; if (m === menuIdx) { cx.fillStyle = "rgba(246,192,101,.16)"; roundRect(MPX + 24, iy - 21, MPW - 48, 42, 8); cx.fill(); cx.strokeStyle = C_GOLD; cx.lineWidth = 2; roundRect(MPX + 24, iy - 21, MPW - 48, 42, 8); cx.stroke() } drawEmo(TITLE_ICONS[m], MPX + 52, iy, 26, 0); txt(TITLE_ITEMS[m].label, W / 2 + 14, iy, 23, (m === menuIdx) ? C_YEL : "#fff", "center"); if (m === menuIdx) txt("\u25B6", MPX + 30, iy, 18, C_YEL, "center") }
            cx.globalAlpha = 0.5 + 0.5 * Math.sin(uiFrame * 0.09);
            txt(isTouch ? "Тап — выбрать пункт" : "\u2191 \u2193 / мышь / 🎮 D-pad — выбор \u00B7 Enter / A — ок", W / 2, 456, 12, "#fff", "center");
            cx.globalAlpha = 1
        }

        function rDrawPause() {
            cx.fillStyle = "rgba(0,0,0,.7)"; cx.fillRect(0, 0, W, H);
            panel(QPX, QPY, QPW, QPH);
            txt("ПАУЗА", W / 2, 190, 34, C_GOLD, "center", "Bangers");
            cx.strokeStyle = "rgba(246,192,101,.5)"; cx.lineWidth = 2;
            cx.beginPath(); cx.moveTo(QPX + 30, 212); cx.lineTo(QPX + QPW - 30, 212); cx.stroke();
            for (var i = 0; i < PAUSE_ITEMS.length; i++) { var iy = QI_Y0 + i * QI_LH; if (i === pauseIdx) { cx.fillStyle = "rgba(246,192,101,.16)"; roundRect(QPX + 22, iy - 20, QPW - 44, 40, 8); cx.fill(); cx.strokeStyle = C_GOLD; cx.lineWidth = 2; roundRect(QPX + 22, iy - 20, QPW - 44, 40, 8); cx.stroke() } txt(PAUSE_ITEMS[i].label, W / 2, iy, (i === pauseIdx) ? 22 : 20, (i === pauseIdx) ? C_YEL : "#fff", "center") }
            txt("Esc / P / \u23F8 — продолжить \u00B7 1/2/3 — сложность", W / 2, 452, 12, "#fff", "center")
        }

        function rDrawHelp() {
            cx.fillStyle = "rgba(0,0,0,.92)"; cx.fillRect(0, 0, W, H);
            panel(120, 40, 720, 460);
            txt("УПРАВЛЕНИЕ", W / 2, 86, 28, C_GOLD, "center", "Bangers");
            var L = ["\u2190\u2192 / A D — смена полосы", "Пробел — прыжок", "Z / ЛКМ — удар", "X / ПКМ — пинок", "E — бросок бутылки", "", "Esc / P — пауза", "1 / 2 / 3 — сложность", "", "ГЕЙМПАД (Sega / DirectInput):", "D-pad — смена полос", "A — удар · B — пинок · C — прыжок", "X / Y — бутылка", "L — бутылка · R — удар", "Start — пауза · Back — выход"];
            cx.fillStyle = "#fff"; cx.font = "15px " + FONT_BODY; cx.textAlign = "left";
            var ty = 122;
            for (var i = 0; i < L.length; i++) { if (L[i] === "") { ty += 8; continue } cx.fillText(L[i], 200, ty); ty += 22 }
            cx.globalAlpha = 0.5 + 0.5 * Math.sin(uiFrame * 0.1);
            txt(isTouch ? "[ тап — закрыть ]" : "[ Esc — закрыть ]", W / 2, 470, 14, C_MUT, "center");
            cx.globalAlpha = 1; cx.textAlign = "left"
        }

        function rDrawEnd(kind) {
            cx.fillStyle = "rgba(0,0,0,.6)"; cx.fillRect(0, 0, W, H);
            panel(W / 2 - 330, 110, 660, 330);
            var mm = Math.floor(G.time / 3600), ss = Math.floor(G.time / 60) % 60, tm = (mm < 10 ? "0" : "") + mm + ":" + (ss < 10 ? "0" : "") + ss;
            txt("ТЕБЯ СНЕСЛИ НА ПОГОНЕ", W / 2, 160, 38, C_RED, "center", "Bangers");
            txt("Бабл-лорд и Кофеарх ушёл в закат. Догоняй снова — и добей.", W / 2, 212, 16, "#fff", "center");
            cx.strokeStyle = "rgba(246,192,101,.4)"; cx.lineWidth = 2;
            cx.beginPath(); cx.moveTo(W / 2 - 280, 258); cx.lineTo(W / 2 + 280, 258); cx.stroke();
            cx.fillStyle = "#fff"; cx.font = "18px " + FONT_BODY; cx.textAlign = "center";
            cx.fillText("ОЧКИ: " + Math.round(G.score) + "      ДИСТАНЦИЯ: " + (G.dist / 1000).toFixed(1) + " KM", W / 2, 296);
            cx.fillText("ВРЕМЯ: " + tm + "      СЛОЖНОСТЬ: " + D().name, W / 2, 326);
            cx.textAlign = "left";
            var h2 = isTouch ? "[ ТАП - ЕЩЁ РАЗ ]" : "[ ПРОБЕЛ / R / A - ЕЩЁ РАЗ ]  \u00B7  [ M - МЕНЮ ]";
            cx.globalAlpha = 0.5 + 0.5 * Math.sin(uiFrame * 0.09);
            txt(h2, W / 2, 388, 15, "#fff", "center");
            cx.globalAlpha = 1;
            txt("Автор и разработчик - Ilya Soyer", W / 2, 416, 13, C_MUT, "center")
        }

        function render() {
            if (phase === "title") { rDrawTitle(); if (overlay === "controls") rDrawHelp(); return }
            if (phase === "pause") { rRenderPlay(); rDrawPause(); if (overlay === "controls") rDrawHelp(); return }
            rRenderPlay();
            if (overlay === "controls") { rDrawHelp(); return }
            if (G.state === "final") rDrawFinal();
            else if (G.state === "lose") rDrawEnd("lose")
        }

        // === FPS И СКОРОСТЬ ИГРЫ ===
        var FPS_LIMIT = 30;
        var FPS_INTERVAL = 1000 / FPS_LIMIT;
        var _lastTime = 0;
        var _acc = 0;
        // СКОРОСТЬ ИГРЫ: 1.0 = норма · 0.75 = на четверть медленнее · 0.5 = вдвое
        var GAME_SPEED = 0.6;

        function loop() {
            requestAnimationFrame(loop);
            var now = performance.now();
            if (_lastTime === 0) { _lastTime = now; return }
            var elapsed = now - _lastTime;
            _lastTime = now;
            if (elapsed > 100) elapsed = 100;
            _acc += elapsed;
            if (_acc < FPS_INTERVAL) return;
            _acc -= FPS_INTERVAL;
            if (_acc > FPS_INTERVAL * 2) _acc = 0;
            pollGamepad();
            updateMusicSync();
            uiFrame += 2;
            buildFrames();
            if (phase === "play") update();
            updateRain();
            render();
            var tEl = document.getElementById("touch");
            if (tEl) tEl.style.display = (isTouch && phase === "play" && G.state === "play") ? "block" : "none"
        }

        rParseQuery();
        reset();
        G.score = R_BASE;
        syncMenuLabels();
        phase = "title";
        requestAnimationFrame(loop);
    </script>
</body>
</html>
